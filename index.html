<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한말 · 대학 한국어 말하기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%232C4A8F%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2738%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E한%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F6F2E9; --paper2:#EDE6D6; --card:#fff; --ink:#1D1B24; --ink2:#5B5866; --ink3:#8E8A97;
  --line:#E6DFCF; --indigo:#2C4A8F; --indigo2:#1F3669; --indigo-soft:#E8EDF8;
  --dan:#C8453B; --dan-soft:#FBEAE7; --jade:#2F8F7F; --jade-soft:#E3F3EF; --gold:#C79A3B; --gold-soft:#FAF1DA;
  --r:18px; --shadow:0 1px 2px rgba(29,27,36,.05),0 10px 28px rgba(29,27,36,.07);
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs,16px);line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid rgba(44,74,143,.45);outline-offset:2px;border-radius:10px}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,242,233,.86);background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:900;font-size:20px;color:var(--indigo2);flex:none}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--indigo);color:#fff;font-style:normal;font-size:19px;box-shadow:0 4px 12px rgba(44,74,143,.35)}
.tb-title{flex:1;min-width:0;text-align:center;font-weight:600;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--gold-soft);color:#8A6717;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.me{background:var(--jade-soft);color:#1E6B5E}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .12s,box-shadow .2s,background .2s;min-height:46px;user-select:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--indigo);color:#fff;box-shadow:0 6px 16px rgba(44,74,143,.32)}
.btn-primary:hover{background:var(--indigo2)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--indigo);color:var(--indigo)}
.btn-dan{background:var(--dan);color:#fff;box-shadow:0 6px 16px rgba(200,69,59,.3)}
.btn-jade{background:var(--jade);color:#fff;box-shadow:0 6px 16px rgba(47,143,127,.3)}
.btn-sm{padding:8px 14px;min-height:38px;font-size:13.5px;border-radius:12px}
.btn-block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);font-size:17px}

/* 카드/공통 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid rgba(230,223,207,.7)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--paper2);color:var(--ink2)}
.chip.on{background:var(--jade-soft);color:#1E6B5E}
.chip.warn{background:var(--dan-soft);color:var(--dan)}
.chip.ind{background:var(--indigo-soft);color:var(--indigo)}
.muted{color:var(--ink2)} .small{font-size:13.5px}
.serif{font-family:var(--serif)}
main{padding:22px 0 90px;min-height:calc(100vh - 60px)}
.sec-title{font-family:var(--serif);font-size:24px;font-weight:700;margin:6px 0 4px}
.empty{text-align:center;padding:46px 18px;color:var(--ink2)}
.empty b{display:block;font-family:var(--serif);font-size:44px;color:var(--paper2);margin-bottom:6px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 시작 화면 */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:38px 26px 30px;color:#fff;background:
  linear-gradient(160deg,var(--indigo) 0%,var(--indigo2) 100%);box-shadow:0 18px 40px rgba(31,54,105,.28)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000 10%,transparent 90%);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 90%)}
.hero .ghost{position:absolute;right:-18px;bottom:-60px;font-family:var(--serif);font-weight:900;font-size:260px;line-height:1;color:rgba(255,255,255,.08);user-select:none}
.hero .jm{position:absolute;top:18px;right:22px;display:flex;gap:8px;font-family:var(--serif);font-weight:700;color:rgba(255,255,255,.55);font-size:20px}
.hero h1{position:relative;font-family:var(--serif);font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1.25;margin-top:8px}
.hero p{position:relative;margin-top:12px;color:rgba(255,255,255,.86);max-width:460px}
.hero .tag{position:relative;display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.start-box{max-width:460px;margin:-26px auto 0;position:relative;z-index:2;display:grid;gap:12px;padding:22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;min-height:48px}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12.5px}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}

/* 단원 카드 */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.ucard{position:relative;text-align:left;background:#fff;border-radius:var(--r);padding:20px;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,border-color .2s;overflow:hidden}
.ucard:hover{transform:translateY(-3px);border-color:var(--indigo)}
.ucard .no{font-family:var(--serif);font-weight:900;font-size:46px;line-height:1;color:var(--indigo-soft);position:absolute;right:14px;top:6px}
.ucard h3{font-family:var(--serif);font-size:18px;line-height:1.4;margin:22px 0 14px;padding-right:46px;position:relative}
.ucard .row{display:flex;gap:6px;flex-wrap:wrap}
.ucard .bar{height:6px;border-radius:99px;background:var(--paper2);margin-top:14px;overflow:hidden}
.ucard .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--jade));border-radius:99px}

/* 단원 화면 / 탭 */
.uhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:13px;color:var(--ink3);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;background:var(--paper2);border-radius:16px;margin-bottom:18px}
.seg button{padding:11px 6px;border-radius:12px;font-weight:700;font-size:15px;color:var(--ink2);transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--indigo);box-shadow:0 2px 10px rgba(29,27,36,.1)}

/* 듣기 */
.player{display:grid;gap:18px}
.pl-main{display:flex;align-items:center;gap:14px}
.playbtn{width:68px;height:68px;border-radius:50%;background:var(--indigo);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(44,74,143,.38);flex:none;transition:transform .15s}
.playbtn:active{transform:scale(.94)}
.seekbox{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--indigo) var(--p,0%),var(--paper2) var(--p,0%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--indigo);box-shadow:0 2px 8px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--indigo)}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .lbl{font-size:13px;font-weight:700;color:var(--ink2);margin-right:2px}
.pill{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px}
.pill.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.pill.ab{border-color:var(--gold);color:#8A6717}
.pill.ab.on{background:var(--gold);color:#fff}
.tr{display:grid;gap:10px;margin-top:6px}
.tr .ln{padding:12px 14px;background:var(--paper);border-radius:14px;border-left:4px solid var(--indigo)}
.tr .sp{display:inline-block;font-weight:800;color:var(--indigo);margin-right:8px}

/* 말하기 */
.avatar{width:56px;height:56px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--dan),#E49A58);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 14px rgba(200,69,59,.28)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:96px;height:96px;font-size:40px}
.sp-head{display:flex;align-items:center;gap:14px;padding:14px 16px}
.sp-head .grow{flex:1;min-width:0}
.sp-head b{font-family:var(--serif);font-size:17px}
.prog{height:6px;background:var(--paper2);border-radius:99px;margin-top:8px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--dan);border-radius:99px;transition:width .4s}
.chat{display:flex;flex-direction:column;gap:14px;padding:18px 2px 20px;min-height:280px}
.msg{display:flex;gap:10px;max-width:88%;animation:fade .3s ease both}
.msg.npc{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:38px;height:38px;font-size:16px;border-width:2px}
.bubble{padding:12px 16px;border-radius:20px;position:relative;box-shadow:0 2px 10px rgba(29,27,36,.06)}
.npc .bubble{background:#fff;border-top-left-radius:6px}
.me .bubble{background:var(--indigo);color:#fff;border-top-right-radius:6px}
.bubble .who{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:2px}
.me .bubble .who{color:rgba(255,255,255,.7)}
.ttsbtn{margin-top:8px;display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;background:var(--indigo-soft);color:var(--indigo);font-size:12.5px;font-weight:700}
.typing{display:flex;gap:5px;align-items:center;padding:14px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.steptxt{font-size:13px;color:var(--ink2);margin-left:6px}
.dock{position:sticky;bottom:0;z-index:20;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(246,242,233,.94);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock-st{text-align:center;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:10px;min-height:22px}
.dock-st.rec{color:var(--dan)}
.dock audio{width:100%;height:38px;margin-bottom:10px}
.dock-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;font-weight:700;font-size:12.5px;background:#fff;border:1.5px solid var(--line);min-height:62px;justify-content:center}
.dbtn span{font-size:22px;line-height:1.1}
.dbtn[disabled]{opacity:.38;pointer-events:none}
.dbtn.rec{background:var(--dan);color:#fff;border-color:var(--dan)}
.dbtn.ok{background:var(--jade);color:#fff;border-color:var(--jade)}
.dbtn.recording{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,69,59,.5)}100%{box-shadow:0 0 0 16px rgba(200,69,59,0)}}
.steps{display:grid;gap:10px;margin:16px 0 20px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:14px}

/* 결과 */
.gauge{position:relative;width:140px;height:140px;margin:0 auto}
.gauge .gv{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gnum b{font-family:var(--serif);font-size:38px;line-height:1}
.gnum span{font-size:12px;color:var(--ink3);font-weight:700}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.lvl{font-family:var(--serif);font-size:22px;font-weight:700}
.tcard{margin-top:14px}
.tcard .q{font-size:13.5px;color:var(--ink3);margin-bottom:10px}
.tcard .row{display:grid;gap:10px}
.tbox{padding:12px 14px;border-radius:14px;background:var(--paper)}
.tbox small{display:block;font-weight:800;font-size:12px;color:var(--ink3);margin-bottom:2px}
.tbox.model{background:var(--jade-soft)} .tbox.model small{color:#1E6B5E}
.tbox.fb{background:var(--gold-soft)} .tbox.fb small{color:#8A6717}
.scorepill{float:right;padding:4px 12px;border-radius:99px;font-weight:800;font-size:14px;color:#fff}
.kws{display:flex;gap:6px;flex-wrap:wrap}
.kw{padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.kw.y{background:var(--jade-soft);color:#1E6B5E}.kw.n{background:var(--dan-soft);color:var(--dan);text-decoration:line-through}
.subs{display:flex;gap:14px;font-size:12.5px;color:var(--ink3);margin-top:6px;flex-wrap:wrap}
ul.bul{margin:6px 0 0;padding-left:20px} ul.bul li{margin:4px 0}

/* 자기평가 */
.qcard{margin-top:12px;padding:18px}
.qn{font-family:var(--serif);font-weight:900;color:var(--indigo);margin-right:6px}
.lk-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.lk{position:relative}
.lk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.lk span{display:grid;place-items:center;padding:10px 0;border-radius:12px;border:1.5px solid var(--line);font-weight:800;background:#fff;transition:.15s}
.lk input:checked+span{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.lk input:focus-visible+span{outline:3px solid rgba(44,74,143,.45);outline-offset:2px}
.lk-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--indigo);background:var(--indigo-soft)}
.opt input{accent-color:var(--indigo);width:18px;height:18px}
.txt{width:100%;margin-top:10px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px}
.txt:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(44,74,143,.12)}
.qcard.miss{border-color:var(--dan);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ox{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:14px;flex:none}
.ox.o{background:var(--jade)}.ox.x{background:var(--dan)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td,.tbl th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--ink3)}
.meter{height:12px;border-radius:99px;background:var(--paper2);overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--jade))}

/* 마이페이지 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--indigo)}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:600}
.trk{display:grid;gap:10px}
.trk .it{display:grid;grid-template-columns:1fr;gap:8px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.trk .it .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chartbox svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.weak{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--dan-soft);margin-top:10px;cursor:pointer;text-align:left;width:100%}
.weak b{font-family:var(--serif)}

/* 모달 / 토스트 / 로딩 */
.ov{position:fixed;inset:0;z-index:60;background:rgba(29,27,36,.5);display:grid;place-items:end center;animation:fade .2s}
.modal{background:var(--paper);width:min(460px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:600px){.ov{place-items:center}.modal{border-radius:26px}}
.modal h2{font-family:var(--serif);font-size:22px;margin-bottom:12px}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--paper2);border-radius:14px;margin-bottom:14px}
.mtabs button{padding:10px;border-radius:11px;font-weight:700;color:var(--ink2)}
.mtabs button.on{background:#fff;color:var(--indigo);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--ink2)}
.err{color:var(--dan);font-size:13.5px;font-weight:600;min-height:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:min(92vw,420px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .25s}

<body>
<header class="topbar"><div class="wrap">
  <button class="brand" data-act="home" aria-label="처음으로"><i id="brandMark">한</i><span id="brandName">한말</span></button>
  <div class="tb-title" id="tbTitle"></div>
  <div class="tb-right" id="tbRight"></div>
</div></header>

<main><div class="wrap" id="main"></div></main>

<div class="loading" id="loading" role="status" aria-live="polite"><div class="spin"></div><div id="loadTxt">불러오는 중…</div></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script>
const _q = new URLSearchParams(location.search);
const BOOT = {
  unit: String(_q.get('unit') || '').trim().slice(0, 40),
  course: ['listening', 'speaking', 'assessment'].includes(String(_q.get('course') || '').toLowerCase()) ? String(_q.get('course')).toLowerCase() : '',
  appUrl: location.origin + location.pathname.replace(/index\.html$/, ''),
  maxTurnSec: 60,
  settings: (() => { try { return JSON.parse(localStorage.getItem('hm_settings') || 'null') || {}; } catch (e) { return {}; } })()
};

/* ───────── 유틸 ───────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const lvl = s => s >= 85 ? '훌륭해요' : s >= 70 ? '좋아요' : s >= 50 ? '조금만 더 힘내요' : '연습이 더 필요해요';
const scol = s => s >= 85 ? 'var(--jade)' : s >= 70 ? 'var(--indigo)' : s >= 50 ? 'var(--gold)' : 'var(--dan)';

async function api(name, ...args) {
  const url = (window.HANMAL && window.HANMAL.API_URL) || '';
  if (/여기에/.test(url) || !/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec/.test(url)) throw new Error('config.js 파일에 API 주소(API_URL)를 입력해 주세요.');
  let res;
  try { res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args }) }); }
  catch (e) { throw new Error('서버에 연결하지 못했어요. 인터넷 연결과 API 주소를 확인해 주세요.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('서버 응답을 읽을 수 없어요. 웹앱 배포의 액세스가 "모든 사용자"인지 확인해 주세요.'); }
  if (!j.ok) throw new Error(j.error || '알 수 없는 오류');
  return j.data;
}
function toast(msg, ms = 2800) {
  const r = $('#toastRoot'); r.innerHTML = '<div class="toast" role="alert">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', ms);
}
function setLoading(on, txt) { $('#loading').classList.toggle('on', !!on); if (txt) $('#loadTxt').textContent = txt; }
function openModal(html) {
  closeModal();
  $('#modalRoot').innerHTML = '<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const f = $('#modalRoot input'); if (f) setTimeout(() => f.focus(), 60);
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function askConfirm(msg, okText = '확인') {
  return new Promise(res => {
    openModal('<h2>잠깐만요</h2><p class="muted" style="margin-bottom:18px">' + esc(msg) + '</p><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-block" id="cNo">취소</button><button class="btn btn-primary btn-block" id="cOk">' + esc(okText) + '</button></div>');
    $('#cNo').onclick = () => { closeModal(); res(false); };
    $('#cOk').onclick = () => { closeModal(); res(true); };
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const emptyBox = (t, g = '말') => `<div class="empty"><b>${g}</b>${esc(t)}</div>`;

/* ───────── 상태 ───────── */
const G = { token: null, user: null, units: [], unit: null, course: 'listening', entered: false, sessions: {}, googleClientId: '', sp: null, as: null, au: null, chartUnit: 'ALL', settings: BOOT.settings || {} };

function cleanup() {
  if (G.au) { try { G.au.el.pause(); } catch (e) {} G.au = null; }
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  const sp = G.sp;
  if (sp) {
    clearInterval(sp.timer); clearInterval(sp.stepTimer);
    try { sp.rec && sp.rec.state !== 'inactive' && (sp.rec.onstop = null, sp.rec.stop()); } catch (e) {}
    try { sp.stream && sp.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    if (sp.url) URL.revokeObjectURL(sp.url);
  }
  G.sp = null;
}

/* ───────── 사이트 설정(관리자 지정) ───────── */
const FONT_MAP = {
  'Pretendard': { css: "'Pretendard Variable',Pretendard", g: '' },
  'Noto Sans KR': { css: "'Noto Sans KR'", g: 'Noto+Sans+KR:wght@400;500;700;900' },
  'Noto Serif KR': { css: "'Noto Serif KR'", g: 'Noto+Serif+KR:wght@600;700;900' },
  'Nanum Gothic': { css: "'Nanum Gothic'", g: 'Nanum+Gothic:wght@400;700;800' },
  'Nanum Myeongjo': { css: "'Nanum Myeongjo'", g: 'Nanum+Myeongjo:wght@400;700;800' },
  'Gowun Dodum': { css: "'Gowun Dodum'", g: 'Gowun+Dodum' },
  'Gowun Batang': { css: "'Gowun Batang'", g: 'Gowun+Batang:wght@400;700' },
  'IBM Plex Sans KR': { css: "'IBM Plex Sans KR'", g: 'IBM+Plex+Sans+KR:wght@400;500;700' },
  'Hahmlet': { css: "'Hahmlet'", g: 'Hahmlet:wght@400;600;800' }
};
const _fontLoaded = {};
function loadFont(k) {
  const f = FONT_MAP[k]; if (!f || !f.g || _fontLoaded[k]) return; _fontLoaded[k] = 1;
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + f.g + '&display=swap'; document.head.appendChild(l);
}
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixHex = (h, t, a) => { const c = hexRgb(h), d = hexRgb(t); return '#' + c.map((v, i) => Math.round(v + (d[i] - v) * a).toString(16).padStart(2, '0')).join(''); };
const st = () => G.settings || BOOT.settings || {};
function applySettings() {
  const s = st(), r = document.documentElement.style, ok = h => /^#[0-9a-fA-F]{6}$/.test(h || '');
  if (ok(s.primary_color)) { r.setProperty('--indigo', s.primary_color); r.setProperty('--indigo2', mixHex(s.primary_color, '#000000', .28)); r.setProperty('--indigo-soft', mixHex(s.primary_color, '#ffffff', .9)); }
  if (ok(s.accent_color)) { r.setProperty('--dan', s.accent_color); r.setProperty('--dan-soft', mixHex(s.accent_color, '#ffffff', .88)); }
  if (ok(s.paper_color)) { r.setProperty('--paper', s.paper_color); r.setProperty('--paper2', mixHex(s.paper_color, '#000000', .05)); r.setProperty('--line', mixHex(s.paper_color, '#000000', .08)); }
  const bf = FONT_MAP[s.body_font], hf = FONT_MAP[s.heading_font];
  if (bf) { loadFont(s.body_font); r.setProperty('--sans', bf.css + ",-apple-system,'Segoe UI','Noto Sans KR',sans-serif"); }
  if (hf) { loadFont(s.heading_font); r.setProperty('--serif', hf.css + ",'Nanum Myeongjo',serif"); }
  const fs = Number(s.base_font_size); if (fs >= 14 && fs <= 20) r.setProperty('--fs', fs + 'px');
  const bm = $('#brandMark'), bn = $('#brandName');
  if (bm && s.brand_mark) bm.textContent = s.brand_mark;
  if (bn && s.site_name) bn.textContent = s.site_name;
  if (s.site_name) document.title = s.site_name;
}
const heroTitle = () => esc(st().hero_title || '').replace(/\n/g, '<br>');

/* ───────── 마이크 진단 (Google Sites 등 iframe 삽입 대응) ───────── */
const UA = navigator.userAgent || '';
function isEmbedded() { try { return window.self !== window.top; } catch (e) { return true; } }
function policyBlocked() { try { const p = document.permissionsPolicy || document.featurePolicy; return !!(p && p.allowsFeature && !p.allowsFeature('microphone')); } catch (e) { return false; } }
function inAppBrowser() { return /KAKAOTALK|NAVER\(inapp|Line\/|Instagram|FBAN|FBAV|DaumApps|; wv\)/i.test(UA); }
function newTabUrl() {
  const base = BOOT.appUrl || ''; if (!base) return '';
  if (G.unit) return base + '?unit=' + encodeURIComponent(G.unit.unit_id) + '&course=speaking';
  return base + (BOOT.unit ? '?unit=' + encodeURIComponent(BOOT.unit) + '&course=' + (BOOT.course || 'speaking') : '');
}
function copyText(txt) {
  const done = () => toast('복사했어요.');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.'); } ta.remove(); };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, fb); return; } } catch (e) {}
  fb();
}
function micNotice() {
  const emb = isEmbedded() || policyBlocked(), app = inAppBrowser();
  if (!emb && !app) return '';
  const url = newTabUrl();
  return `<div class="notice"><b>⚠️ 마이크가 막힐 수 있어요</b>
    <span>${emb ? '이 화면이 구글 사이트 같은 다른 페이지 안에 삽입돼 있으면 브라우저 보안 정책 때문에 마이크가 차단돼요. <b>새 탭에서 직접 열어</b> 사용해 주세요.' : '카카오톡·네이버 등 앱 안의 브라우저에서는 마이크가 막히는 경우가 많아요. 주소를 복사해 <b>Chrome 또는 Safari</b>에서 열어 주세요.'}</span>
    <div class="nrow">${url && emb ? `<a class="btn btn-primary btn-sm" href="${esc(url)}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>` : ''}<button class="btn btn-ghost btn-sm" data-act="copyLink">📋 주소 복사</button></div></div>`;
}
async function micModal(e) {
  const name = (e && e.name) || '', emb = isEmbedded(), blocked = policyBlocked(), app = inAppBrowser(), url = newTabUrl();
  let body;
  if (blocked || (emb && /NotAllowed|Permission|Security/i.test(name))) body = '이 화면이 구글 사이트 같은 다른 페이지 안에 삽입돼 있어, 브라우저 보안 정책(Permissions-Policy) 때문에 마이크가 차단됐을 수 있어요.<br><b>웹앱 주소를 새 탭(새 창)에서 직접 열어 사용해 주세요.</b>';
  else if (app) body = '카카오톡·네이버 등 앱 안의 브라우저에서는 마이크가 막히는 경우가 많아요. 주소를 복사해 <b>Chrome 또는 Safari</b>에서 열어 주세요.';
  else if (/NotAllowed|PermissionDenied/i.test(name)) body = '마이크 권한이 거부돼 있어요. 주소창 왼쪽의 자물쇠(설정) 아이콘에서 <b>마이크를 허용</b>한 뒤 페이지를 새로고침해 주세요.<br>그래도 안 되면 아래 버튼으로 웹앱 주소를 새 탭에서 직접 열어 보세요.';
  else if (/NotFound|DevicesNotFound/i.test(name)) body = '연결된 마이크를 찾을 수 없어요. 이어폰 마이크나 기기 설정을 확인해 주세요.';
  else if (/NotReadable|TrackStart/i.test(name)) body = '다른 앱(통화·화상회의 등)이 마이크를 쓰고 있을 수 있어요. 그 앱을 닫고 다시 시도해 주세요.';
  else body = '마이크를 시작하지 못했어요. Chrome 또는 Safari에서 새 탭으로 열어 다시 시도해 주세요.';
  let perm = '확인 불가';
  try { if (navigator.permissions && navigator.permissions.query) perm = (await Promise.race([navigator.permissions.query({ name: 'microphone' }), new Promise((_, r) => setTimeout(r, 800))])).state; } catch (x) {}
  const detail = `오류: ${esc(name || '-')}${e && e.message ? ' — ' + esc(e.message) : ''}<br>다른 페이지에 삽입됨: ${emb ? '예' : '아니오'} · 정책 차단: ${blocked ? '예' : '아니오'} · 보안 연결: ${window.isSecureContext ? '예' : '아니오'}<br>마이크 권한 상태: ${esc(perm)} · 앱 내 브라우저: ${app ? '예' : '아니오'}<br>${esc(UA)}`;
  openModal(`<h2>🎤 마이크를 사용할 수 없어요</h2><p class="muted">${body}</p>
    ${url ? `<a class="btn btn-primary btn-block" style="margin-top:12px" href="${esc(url)}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>` : ''}
    ${$('#recFile') ? '<button class="btn btn-jade btn-block" style="margin-top:8px" data-act="fileRec">🎧 대신 녹음 앱·파일로 답하기</button><p class="small muted" style="margin:4px 2px 0">휴대폰의 녹음 앱으로 녹음하거나 저장된 녹음 파일을 선택하면 똑같이 평가돼요.</p>' : ''}
    <button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="copyLink">📋 주소 복사</button>
    <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">자세한 정보 (문의할 때 알려 주세요)</summary><p class="small muted" style="margin-top:6px;word-break:break-all">${detail}</p></details>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="closeModal">닫기</button>`);
}
async function micTest() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return micModal({ name: 'NotSupported', message: '이 브라우저는 마이크를 지원하지 않아요' });
  try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); st.getTracks().forEach(t => t.stop()); toast('🎙️ 마이크가 정상이에요! 대화를 시작해 보세요.', 3500); }
  catch (e) { micModal(e); }
}

function openAdmin(tab) {
  if (typeof window.viewAdmin === 'function') return window.viewAdmin(tab);
  toast('관리자 화면을 불러오지 못했어요. 학습자 화면으로 이동합니다.', 4500); return viewUnits(false);
}

/* ───────── 상단 바 ───────── */
function renderTopbar() {
  $('#tbTitle').textContent = G.unit ? G.unit.unit_title : '';
  const u = G.user;
  $('#tbRight').innerHTML = u
    ? `<span class="badge me" title="${esc(u.email)}">👤 ${esc(u.name)}</span>${u.role === 'admin' ? '<button class="btn btn-primary btn-sm" data-act="adminHome">관리자</button>' : ''}<button class="btn btn-ghost btn-sm" data-act="mypage">마이페이지</button><button class="iconbtn" data-act="logout" aria-label="로그아웃" title="로그아웃">⎋</button>`
    : `<span class="badge">게스트</span><button class="btn btn-primary btn-sm" data-act="login">로그인</button>`;
}

/* ───────── 시작 화면 ───────── */
function viewStart() {
  cleanup(); G.unit = null; renderTopbar();
  $('#main').innerHTML = `
  <section class="fade">
    <div class="hero">
      <div class="jm"><span>ㄱ</span><span>ㅏ</span><span>ㄴ</span><span>ㅏ</span></div>
      <div class="ghost">말</div>

// 어떤 브라우저에서 녹음해도 16kHz 모노 WAV로 통일 (AI 음성 인식 호환성)
async function blobToWav(blob) {

  const buf = await readBuf(blob);
  const ctx = new AC();

  try { ctx.close(); } catch (e) {}
  const rate = 16000, off = new OAC(1, Math.max(1, Math.ceil(audio.duration * rate)), rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();

function readBuf(blob) {

async function submitTurn() {
  const sp = G.sp; if (!sp || sp.busy || !sp.blob) return;
  sp.busy = true; setDock('busy'); addTyping('녹음 파일을 올리는 중…');
  const steps = ['녹음 파일을 올리는 중…', '음성을 글자로 바꾸는 중…', 'AI가 답변을 살펴보는 중…', '상대가 다음 말을 준비하는 중…']; let k = 0;

  try {

    catch (e) { payload = { blob: sp.blob, mime: (sp.blob.type || 'audio/webm').split(';')[0] }; }
    const b64 = await blobToB64(payload.blob);

function lineChart(pts, thr) {
  const W = 640, H = 250, p = { l: 38, r: 16, t: 16, b: 34 }, iw = W - p.l - p.r, ih = H - p.t - p.b;
  const X = i => p.l + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1)), Y = v => p.t + ih * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="말하기 정확도 추이 그래프">`;
  [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${p.l}" x2="${W - p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6DFCF"/><text x="${p.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#8E8A97">${v}</text>`; });
  s += `<line x1="${p.l}" x2="${W - p.r}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="#C8453B" stroke-dasharray="5 5"/><text x="${W - p.r}" y="${Y(thr) - 5}" text-anchor="end" font-size="11" fill="#C8453B">보완 기준 ${thr}</text>`;
  s += `<path d="${pts.map((t, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(t.score)).join(' ')}" fill="none" stroke="#2C4A8F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((t, i) => {
    s += `<circle cx="${X(i)}" cy="${Y(t.score)}" r="5.5" fill="#fff" stroke="${t.score < thr ? '#C8453B' : '#2C4A8F'}" stroke-width="3"><title>${esc(t.unit_title)} · ${esc(t.date)} · ${t.score}점</title></circle>`;
    if (pts.length <= 10 || i % Math.ceil(pts.length / 8) === 0) s += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#8E8A97">${esc(String(t.date).slice(5, 10))}</text>`;
  });
  return s + '</svg>';
}

function logout() {

/* Google 로그인 (선택: GOOGLE_CLIENT_ID 설정 시) */
let gsiLoaded = false;
function loadGsi() {
  return new Promise((res, rej) => {
    if (gsiLoaded && window.google && google.accounts) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => { gsiLoaded = true; res(); }; s.onerror = rej; document.head.appendChild(s);
  });
}
async function googleLogin() {
  if (!G.googleClientId) { toast('Google 로그인은 아직 준비 중이에요. 이메일로 로그인해 주세요.', 3600); return; }
  try {
    await loadGsi();
    google.accounts.id.initialize({ client_id: G.googleClientId, callback: async resp => {
      try { setLoading(true, 'Google 계정을 확인하는 중…'); afterAuth(await api('api_googleLogin', resp.credential)); } catch (e) { toast(e.message, 4000); } finally { setLoading(false); }
    } });
    const host = $('#gHost2') || $('#gHost'); host.innerHTML = '';
    google.accounts.id.renderButton(host, { theme: 'outline', size: 'large', text: 'continue_with', locale: 'ko', width: 280 });
    toast('아래 Google 버튼을 눌러 주세요.');
  } catch (e) { toast('Google 로그인을 불러오지 못했어요. 이메일로 로그인해 주세요.', 4000); }
}

        <td class="num">${u.weak ? `<span class="chip warn">${u.weak}</span>` : '0'}</td></tr>`).join('') : '<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">단원이 없어요.</td></tr>'}
      </tbody></table></div></div>
    <div class="card" style="margin-top:14px"><b>👥 전체 학습자</b>
      <div class="g2" style="margin-top:10px"><input class="txt" data-ad="q" type="search" placeholder="이름 또는 이메일 검색" value="${esc(A.q)}" aria-label="학습자 검색">
      <select class="txt" data-ad="sort" aria-label="정렬"><option value="recent">최근 접속순</option><option value="name">이름순</option><option value="speaking">말하기 평균 높은순</option><option value="weak">보완 필요 많은순</option></select></div>

/* ───────── 파일 업로드 ───────── */
function adResize(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? res({ blob: b, mime: 'image/jpeg' }) : rej(new Error('이미지를 변환하지 못했어요.')), 'image/jpeg', .86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없어요.')); };
    img.src = url;
  });
}
async function adUploadFile(input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  const kind = input.dataset.kind;
  if (kind === 'audio' && f.size > 11 * 1024 * 1024) return toast('음원이 너무 커요(11MB 이하). Drive에 올린 뒤 공유 링크를 붙여 넣어 주세요.', 5500);
  if (kind === 'image' && !/^image\//.test(f.type)) return toast('이미지 파일을 선택해 주세요.');
  setLoading(true, '파일을 올리는 중… (큰 파일은 1분 정도 걸려요)');
  try {
    let blob = f, mime = f.type || '';
    if (kind === 'image') { const r = await adResize(f, 480); blob = r.blob; mime = r.mime; }
    const b64 = await blobToB64(blob);
    const r = await api('api_admin_uploadFile', G.token, kind, A.unit.unit_id, f.name, mime, b64);
    setLoading(false);
    if (kind === 'audio') { A.unit.audio_url = r.url; A.dirty.unit = 1; adSubBasic(); }
    else adSetChar('character_img_url', r.url);
    toast(r.shared ? '업로드했어요. 아래 저장 버튼을 눌러 반영하세요.' : '업로드는 됐지만 공유 설정에 실패했어요. Drive에서 "링크가 있는 모든 사용자"로 바꿔 주세요.', 6000);
  } catch (e) { setLoading(false); toast(e.message, 5000); }
}

document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.ad; if (!k || k === 'file') return;
  const v = t.type === 'checkbox' ? t.checked : t.value, f = t.dataset.f, i = +t.dataset.i;
  if (k === 'q') { A.q = v; const tb = $('#lrnBody'); if (tb) tb.innerHTML = adLearnerRows(); }
  else if (k === 'sort') { A.sort = v; const tb = $('#lrnBody'); if (tb) tb.innerHTML = adLearnerRows(); }
  else if (k === 'unit') { A.unit[f] = v; A.dirty.unit = 1; }
  else if (k === 'char') adSetChar(f, v);
  else if (k === 'dlg') { A.dlg[i][f] = v; A.dirty.dlg = 1; }
  else if (k === 'qs') { A.qs[i][f] = v; A.dirty.qs = 1; }
  else if (k === 'set') {
    G.settings[f] = v; A.setDirty = true; applySettings();
    if (f === 'base_font_size') { const o = $('#fsOut'); if (o) o.textContent = v + 'px'; t.style.setProperty('--p', (v - 14) / 6 * 100 + '%'); }
  }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.ad; if (!k) return;
  if (k === 'file') adUploadFile(t);
  else if (k === 'qs' && t.dataset.f === 'type') adSubAssess();
});

/* ───────── 클릭 동작 등록 ───────── */
Object.assign(ACT, {
  adminHome: () => { adRevertSettings(); A.unit = null; A.dirty = {}; viewAdmin('overview'); },
  adTab: async t => {
    if (A.unit && adDirty() && !(await askConfirm('저장하지 않은 변경이 있어요. 이동할까요?', '이동'))) return;
    adRevertSettings(); A.unit = null; A.dirty = {}; viewAdmin(t.dataset.tab);
  },
  adLearner: t => adLearner(t.dataset.id),
  adPlay: t => adPlay(t),
  adOpenUnit: t => adOpenUnit(t.dataset.id),
  adNewUnit: () => adNewUnit(),
  adBack: async () => {
    if (adDirty() && !(await askConfirm('저장하지 않은 변경이 있어요. 나갈까요?', '나가기'))) return;
    A.unit = null; A.dirty = {}; viewAdmin('units');
  },
  adSub: t => { A.sub = t.dataset.sub; adEditor(); },
  adSaveUnit: () => adSaveUnit(),
  adDelUnit: () => adDelUnit(),
  adClearAudio: () => { A.unit.audio_url = ''; A.dirty.unit = 1; adSubBasic(); },
  adClearChar: () => adSetChar('character_img_url', ''),
  adAddTurn: () => {
    A.dlg.push(Object.assign({}, A.char, { npc_line: '', ref_answer: '', keywords: '', next_rule: '' })); A.dirty.dlg = 1; adSubSpeaking();
    const l = $('#adTurns').lastElementChild; if (l) l.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  adTurnUp: t => { const i = +t.dataset.i; if (i > 0) { [A.dlg[i - 1], A.dlg[i]] = [A.dlg[i], A.dlg[i - 1]]; A.dirty.dlg = 1; adSubSpeaking(); } },
  adTurnDown: t => { const i = +t.dataset.i; if (i < A.dlg.length - 1) { [A.dlg[i + 1], A.dlg[i]] = [A.dlg[i], A.dlg[i + 1]]; A.dirty.dlg = 1; adSubSpeaking(); } },
  adTurnDel: async t => {
    if (A.dlg.length <= 1) return toast('대화는 최소 1개가 필요해요.');
    if (!(await askConfirm('이 대화를 삭제할까요? (분기 규칙의 번호도 확인해 주세요)', '삭제'))) return;
    A.dlg.splice(+t.dataset.i, 1); A.dirty.dlg = 1; adSubSpeaking();
  },
  adSaveDlg: () => adSaveDlg(),
  adAddQ: t => {
    const type = t.dataset.type;
    A.qs.push({ type, question_text: '', options: '', answer: '', score: type === 'indirect' ? '' : 10 }); A.dirty.qs = 1; adSubAssess();
    const l = $('#adQs').lastElementChild; if (l) l.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  adQUp: t => { const i = +t.dataset.i; if (i > 0) { [A.qs[i - 1], A.qs[i]] = [A.qs[i], A.qs[i - 1]]; A.dirty.qs = 1; adSubAssess(); } },
  adQDown: t => { const i = +t.dataset.i; if (i < A.qs.length - 1) { [A.qs[i + 1], A.qs[i]] = [A.qs[i], A.qs[i + 1]]; A.dirty.qs = 1; adSubAssess(); } },
  adQDel: async t => { if (!(await askConfirm('이 문항을 삭제할까요?', '삭제'))) return; A.qs.splice(+t.dataset.i, 1); A.dirty.qs = 1; adSubAssess(); },
  adSaveQs: () => adSaveQs(),
  adSaveSet: () => adSaveSettings(),
  adRevertSet: () => { adRevertSettings(); adDrawDesign(); },
  adDefaultSet: () => { G.settings = Object.assign({}, A.defaults); A.setDirty = true; applySettings(); adDrawDesign(); }
});

window.viewAdmin = viewAdmin;
})();
</script>
</body>
</html>
